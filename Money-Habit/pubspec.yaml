name: money_habit_tracker
description: "Money Habit Tracker - Finansal Alışkanlık Takip Uygulaması"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  shared_preferences: ^2.3.0
  image_picker: ^1.1.0
  path_provider: ^2.1.0
  crypto: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0F1D"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
  macos:
    generate: true
    image_path: "assets/icons/app_icon.png"

flutter_native_splash:
  color: "#0A0F1D"
  color_dark: "#0A0F1D"
  image: "assets/icons/splash_logo.png"
  image_dark: "assets/icons/splash_logo.png"
  android_12:
    color: "#0A0F1D"
    color_dark: "#0A0F1D"
    image: "assets/icons/splash_logo.png"
    image_dark: "assets/icons/splash_logo.png"
  web: false

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/avatars/
    - assets/icons/
