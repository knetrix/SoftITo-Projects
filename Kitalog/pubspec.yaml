name: kitalog
description: "Kitalog – kişisel sanal kütüphane: kitaplarını, okuma durumunu, alıntılarını ve yıllık okuma hedefini takip et."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.6
  intl: ^0.20.3
  http: ^1.6.0
  crypto: ^3.0.7
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  file_picker: ^13.1.0
  archive: ^4.5.2
  pdfrx: ^2.9.0
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/avatars/
    - assets/icon/splash_logo.png
    - assets/books/
    - assets/fonts/OFL.txt
  fonts:
    # DM Serif Display (Colophon Foundry, SIL Open Font License 1.1): uygulama adı ve başlıklar.
    - family: DMSerifDisplay
      fonts:
        - asset: assets/fonts/DMSerifDisplay-Regular.ttf

flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#14161B"
  adaptive_icon_foreground: assets/icon/app_icon_foreground.png
  adaptive_icon_monochrome: assets/icon/app_icon_monochrome.png
  web:
    generate: true
    image_path: assets/icon/app_icon.png
    background_color: "#14161B"
    theme_color: "#F2A93B"
  windows:
    generate: true
    image_path: assets/icon/app_icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/icon/app_icon.png

flutter_native_splash:
  color: "#14161B"
  image: assets/icon/splash_logo.png
  android: true
  ios: true
  web: true
  android_12:
    color: "#14161B"
    image: assets/icon/splash_logo.png
